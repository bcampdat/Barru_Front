<div class="formulario-empresa">

  <header class="formulario-empresa-header">
    <h1 class="formulario-empresa-titulo">
      {{ esEdicion() ? 'Modificar empresa' : 'Nueva empresa' }}
    </h1>
  </header>

  @if (error()) {
    <div class="formulario-empresa-error">
      <p-message severity="error">
        {{ error() }}
      </p-message>
    </div>
  }

  @if (cargando()) {

    <div class="formulario-empresa-cargando">
      Cargando empresa...
    </div>

  } @else {

    <form
      class="formulario-empresa-form"
      [formGroup]="formulario"
      (ngSubmit)="guardar()"
    >

      <div class="formulario-empresa-panel">

        <div class="formulario-empresa-identidad">

          <div class="formulario-empresa-campo formulario-empresa-nombre">
            <label for="nombre">
              Nombre
            </label>

            <input
              id="nombre"
              class="formulario-empresa-input"
              type="text"
              pInputText
              formControlName="nombre"
              maxlength="150"
              required
            />
          </div>

          <div class="formulario-empresa-logo">

            <label for="logo">
              Logo
            </label>

            @if (logoActual()) {

              <div class="formulario-empresa-logo-actual">
                <img
                  [src]="logoActual()"
                  alt="Logo actual de la empresa"
                />
              </div>

            }

            <input
              id="logo"
              class="formulario-empresa-archivo"
              type="file"
              accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
              (change)="seleccionarLogo($event)"
            />

            @if (esEdicion()) {

              <small class="formulario-empresa-ayuda">
                Si no seleccionas otro logo, se conservará el actual.
              </small>

            }

          </div>

        </div>


        <div class="formulario-empresa-jornada">

          <fieldset class="formulario-empresa-grupo">

            <legend>
              Jornada diaria
            </legend>

            <div class="formulario-empresa-duracion">

              <div class="formulario-empresa-duracion-campo">
                <label for="jornadaHoras">
                  Horas
                </label>

                <input
                  id="jornadaHoras"
                  class="formulario-empresa-input"
                  type="number"
                  formControlName="jornadaHoras"
                  min="0"
                  max="24"
                  step="1"
                />
              </div>

              <div class="formulario-empresa-duracion-campo">
                <label for="jornadaMinutosResto">
                  Minutos
                </label>

                <input
                  id="jornadaMinutosResto"
                  class="formulario-empresa-input"
                  type="number"
                  formControlName="jornadaMinutosResto"
                  min="0"
                  max="59"
                  step="1"
                />
              </div>

            </div>

          </fieldset>


          <fieldset class="formulario-empresa-grupo">

            <legend>
              Pausa disponible
            </legend>

            <div class="formulario-empresa-duracion">

              <div class="formulario-empresa-duracion-campo">
                <label for="pausaHoras">
                  Horas
                </label>

                <input
                  id="pausaHoras"
                  class="formulario-empresa-input"
                  type="number"
                  formControlName="pausaHoras"
                  min="0"
                  max="24"
                  step="1"
                />
              </div>

              <div class="formulario-empresa-duracion-campo">
                <label for="pausaMinutosResto">
                  Minutos
                </label>

                <input
                  id="pausaMinutosResto"
                  class="formulario-empresa-input"
                  type="number"
                  formControlName="pausaMinutosResto"
                  min="0"
                  max="59"
                  step="1"
                />
              </div>

            </div>

          </fieldset>

        </div>


        <div class="formulario-empresa-configuracion">

          <div class="formulario-empresa-campo">
            <label for="limiteUsuarios">
              Límite de usuarios
            </label>

            <input
              id="limiteUsuarios"
              class="formulario-empresa-input"
              type="number"
              formControlName="limiteUsuarios"
              min="1"
              max="100000"
              step="1"
              required
            />
          </div>

          <div class="formulario-empresa-campo">
            <label for="radioFichaje">
              Radio de fichaje en metros
            </label>

            <input
              id="radioFichaje"
              class="formulario-empresa-input"
              type="number"
              formControlName="radioFichaje"
              min="5"
              max="500"
              step="1"
              required
            />
          </div>

        </div>


        <div class="formulario-empresa-coordenadas">

          <div class="formulario-empresa-campo">
            <label for="latitud">
              Latitud
            </label>

            <input
              id="latitud"
              class="formulario-empresa-input"
              type="number"
              formControlName="latitud"
              step="any"
              required
            />
          </div>

          <div class="formulario-empresa-campo">
            <label for="longitud">
              Longitud
            </label>

            <input
              id="longitud"
              class="formulario-empresa-input"
              type="number"
              formControlName="longitud"
              step="any"
              required
            />
          </div>

        </div>

      </div>


      <div class="formulario-empresa-acciones">

        <button
          type="button"
          class="boton-secundario"
          [disabled]="guardando()"
          (click)="volver()"
        >
          Cancelar
        </button>

        <button
          type="submit"
          class="boton-primario"
          [disabled]="guardando()"
        >
          @if (guardando()) {
            Guardando...
          } @else {
            {{ esEdicion() ? 'Guardar cambios' : 'Crear empresa' }}
          }
        </button>

      </div>

    </form>

  }

</div>
