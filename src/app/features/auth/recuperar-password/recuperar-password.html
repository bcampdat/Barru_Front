<div class="recuperar-page">

  <div class="recuperar-card">

    <div class="recuperar-header">
      <h1>Recuperar contraseña</h1>

      <p>
        Introduce tu correo electrónico y te enviaremos
        las instrucciones para recuperar tu contraseña.
      </p>
    </div>

    <form
      [formGroup]="formulario"
      (ngSubmit)="solicitarRecuperacion()"
      novalidate
    >

      <div class="campo">

        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          type="email"
          pInputText
          formControlName="email"
          autocomplete="email"
        />

        @if (emailInvalido()) {
          <small>
            Introduce un correo electrónico válido.
          </small>
        }

      </div>


      @if (error()) {
        <p-message severity="error">
          {{ error() }}
        </p-message>
      }


      @if (exito()) {
        <p-message severity="success">
          {{ exito() }}
        </p-message>
      }


      @if (!completado()) {

        <p-button
          type="submit"
          label="Enviar instrucciones"
          [loading]="enviando()"
          [disabled]="enviando()"
        />

      }

    </form>

  </div>

</div>
