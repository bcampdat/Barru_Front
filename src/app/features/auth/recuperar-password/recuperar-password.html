<div class="recuperar-page">

  <div class="recuperar-card">

    <div class="recuperar-logo">

      <!-- Barru claro: tarjeta oscura -->
      <img
        src="/assets/logo-dark.png"
        alt="Barru"
        class="logo logo-tarjeta-oscura"
      />

      <!-- Barru oscuro: tarjeta clara -->
      <img
        src="/assets/logo-light.png"
        alt="Barru"
        class="logo logo-tarjeta-clara"
      />

    </div>

    <div class="recuperar-header">

      <h1>Recuperar contraseña</h1>

      <p>
        Introduce tu correo electrónico y te enviaremos
        las instrucciones para recuperar tu contraseña.
      </p>

    </div>

    <form
      [formGroup]="formulario"
      (ngSubmit)="solicitarRecuperacion()"
      novalidate
    >

      <div class="campo">

        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          type="email"
          pInputText
          formControlName="email"
          autocomplete="email"
        />

        @if (emailInvalido()) {

          <p-message
            severity="error"
            variant="simple"
          >
            Introduce un correo electrónico válido.
          </p-message>

        }

      </div>

      @if (error()) {

        <p-message severity="error">
          {{ error() }}
        </p-message>

      }

      @if (exito()) {

        <p-message severity="success">
          {{ exito() }}
        </p-message>

      }

      @if (!completado()) {

        <p-button
          type="submit"
          label="Enviar instrucciones"
          [loading]="enviando()"
          [disabled]="enviando()"
        />

      }

    </form>

  </div>

</div>
